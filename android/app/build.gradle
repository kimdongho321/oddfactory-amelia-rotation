plugins { id 'com.android.application' }
// 프레임(WebP)·motions.json·아이콘은 빌드할 때 tools/export_frames.py가 art/play에서 만든다. 손으로 고치지 않는다.
def gen=layout.buildDirectory.dir('generated/frames')
def exportFrames=tasks.register('exportFrames',Exec){
 workingDir rootProject.projectDir
 commandLine 'python',rootProject.file('tools/export_frames.py').absolutePath
 inputs.dir(rootProject.file('../art/play'));inputs.file(rootProject.file('../art/seq.json'));inputs.file(rootProject.file('tools/export_frames.py'))
 outputs.dir(gen)
}
android {
 namespace 'com.oddfactory.amelia'
 compileSdk 35
 defaultConfig { applicationId 'com.oddfactory.amelia'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/frames/assets')]
 sourceSets.main.res.srcDirs += [layout.buildDirectory.dir('generated/frames/res')]
 lint { checkReleaseBuilds false }
 buildFeatures { buildConfig true }
 buildTypes { release { debuggable false; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro' } }
}
tasks.named('preBuild').configure { dependsOn(exportFrames) }
